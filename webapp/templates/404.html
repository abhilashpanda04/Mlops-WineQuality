{% extends 'base.html' %}

{% block title %}
Page Not Found | 404 Error
{% endblock title %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="text-center p-5 card shadow border-0 rounded-4 max-w-lg">
    <div class="display-1 text-danger fw-bold mb-3"><i class="fa-solid fa-triangle-exclamation me-3"></i>404</div>
    <h3 class="fw-bold text-dark">Oops! Page Not Found</h3>
    <p class="text-muted mt-2 mb-4">
      {% if error and error.error %}
        {{ error.error }}
      {% else %}
        The requested page or resource could not be found.
      {% endif %}
    </p>
    <div>
      <a href="/" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm fw-semibold">
        <i class="fa-solid fa-house me-2"></i>Return Home
      </a>
    </div>
  </div>
</div>
{% endblock body %}
